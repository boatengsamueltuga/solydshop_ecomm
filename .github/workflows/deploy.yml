name: Build and Deploy Backend

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solydShopdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests
        env:
          DB_PASSWORD: postgres
          JWT_SECRET: ci-test-secret-not-used-in-production
          CLOUDINARY_API_KEY: ci-dummy
          CLOUDINARY_API_SECRET: ci-dummy
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          MAIL_USERNAME: ci@example.com
          MAIL_PASSWORD: ci-dummy
        run: ./mvnw test -B

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/solydshop-backend:latest
            ghcr.io/${{ github.repository_owner }}/solydshop-backend:${{ github.sha }}

  deploy:
    needs: test-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/solydshop
            docker compose pull backend
            docker compose up -d backend
