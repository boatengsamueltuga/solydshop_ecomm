spring.config.import=optional:application-secrets.properties

spring.application.name=ecommerce

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/solydShopdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dqhowyunn}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_51SnoFuRnhf3kkRqoWSBSpUaahI9fwvDQDtuJ6up5OXpm1aJIjtnMY6Afw1w8ugezp9zjWJR8LW4siCfV3FZfhdlI00ycvhyGGR}
# Run: stripe listen --forward-to localhost:8080/api/payment/webhook  to get this value locally
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Mail (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Mail is best-effort (password reset only) - don't let a transient SMTP
# issue mark the whole app unhealthy
management.health.mail.enabled=false

# Frontend URL for password reset link
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# CORS - comma-separated list of allowed origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Auth cookies - both must flip together for cross-site production use
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:Lax}
