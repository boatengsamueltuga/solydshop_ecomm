apiVersion: apps/v1
kind: Deployment
metadata:
  name: solydshop-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solydshop-backend
  template:
    metadata:
      labels:
        app: solydshop-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/boatengsamueltuga/solydshop-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: solydshop-config
            - secretRef:
                name: solydshop-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
